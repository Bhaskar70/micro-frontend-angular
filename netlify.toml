[build]
  command = "npm run build:all"
  publish = "dist/publish"

# SPA routing fallback for Host and direct deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CORS headers for remote entry and federated chunks
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"